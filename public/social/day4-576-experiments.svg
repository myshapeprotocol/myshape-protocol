<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)" opacity="0.3"/>

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="630" x2="1200" y2="630"/>
  </g>

  <!-- Header -->
  <text x="600" y="80" text-anchor="middle" font-size="42" font-weight="700" fill="white">576 Experiments · 4 Evidence Engines</text>
  <text x="600" y="120" text-anchor="middle" font-size="20" fill="rgba(255,255,255,0.5)" letter-spacing="2">CPS-0001 — Experimental Results</text>

  <!-- Engine cards -->
  <!-- EE-001 -->
  <rect x="40" y="160" width="260" height="200" rx="12" fill="rgba(124,58,237,0.1)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5"/>
  <text x="170" y="200" text-anchor="middle" font-size="16" font-weight="600" fill="#a78bfa">EE-001 (PES)</text>
  <text x="170" y="225" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.5)">Presence Entropy Score</text>
  <text x="170" y="275" text-anchor="middle" font-size="48" font-weight="700" fill="white">N=281</text>
  <text x="170" y="310" text-anchor="middle" font-size="14" fill="rgba(255,255,255,0.6)">Cohen's d = 2.1</text>
  <rect x="70" y="325" width="200" height="24" rx="12" fill="rgba(124,58,237,0.2)"/>
  <text x="170" y="341" text-anchor="middle" font-size="11" fill="#a78bfa">4-dim biological noise analysis</text>

  <!-- EE-002 -->
  <rect x="330" y="160" width="260" height="200" rx="12" fill="rgba(59,130,246,0.1)" stroke="rgba(59,130,246,0.3)" stroke-width="1.5"/>
  <text x="460" y="200" text-anchor="middle" font-size="16" font-weight="600" fill="#93c5fd">EE-002 (Causal)</text>
  <text x="460" y="225" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.5)">Cross-Modal Coupling</text>
  <text x="460" y="275" text-anchor="middle" font-size="48" font-weight="700" fill="white">N=316</text>
  <text x="460" y="310" text-anchor="middle" font-size="14" fill="rgba(255,255,255,0.6)">100% alignment</text>
  <rect x="370" y="325" width="200" height="24" rx="12" fill="rgba(59,130,246,0.2)"/>
  <text x="460" y="341" text-anchor="middle" font-size="11" fill="#93c5fd">Camera × IMU temporal match</text>

  <!-- EE-003 -->
  <rect x="620" y="160" width="260" height="200" rx="12" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.3)" stroke-width="1.5"/>
  <text x="750" y="200" text-anchor="middle" font-size="16" font-weight="600" fill="#6ee7b7">EE-003 (Challenge)</text>
  <text x="750" y="225" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.5)">Challenge-Response</text>
  <text x="750" y="275" text-anchor="middle" font-size="48" font-weight="700" fill="white">N=200</text>
  <text x="750" y="310" text-anchor="middle" font-size="14" fill="rgba(255,255,255,0.6)">60% pass rate</text>
  <rect x="660" y="325" width="200" height="24" rx="12" fill="rgba(16,185,129,0.2)"/>
  <text x="750" y="341" text-anchor="middle" font-size="11" fill="#6ee7b7">Randomized gyroscope challenges</text>

  <!-- VS-001 -->
  <rect x="910" y="160" width="260" height="200" rx="12" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.3)" stroke-width="1.5"/>
  <text x="1040" y="200" text-anchor="middle" font-size="16" font-weight="600" fill="#fcd34d">VS-001 (Pipeline)</text>
  <text x="1040" y="225" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.5)">Verification Session</text>
  <text x="1040" y="275" text-anchor="middle" font-size="48" font-weight="700" fill="white">N=60</text>
  <text x="1040" y="310" text-anchor="middle" font-size="14" fill="rgba(255,255,255,0.6)">93% pass rate</text>
  <rect x="950" y="325" width="200" height="24" rx="12" fill="rgba(245,158,11,0.2)"/>
  <text x="1040" y="341" text-anchor="middle" font-size="11" fill="#fcd34d">Passive + active combined</text>

  <!-- Bottom: Forgery Cost -->
  <rect x="40" y="390" width="1120" height="100" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="600" y="425" text-anchor="middle" font-size="18" font-weight="600" fill="rgba(255,255,255,0.8)">Forgery Cost Multiplier</text>

  <!-- Cost bar -->
  <rect x="80" y="445" width="160" height="16" rx="8" fill="rgba(255,255,255,0.1)"/>
  <text x="160" y="478" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.4)">Single frame (1×)</text>
  <rect x="260" y="445" width="200" height="16" rx="8" fill="rgba(124,58,237,0.4)"/>
  <text x="360" y="478" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.4)">+ Temporal (5×)</text>
  <rect x="480" y="445" width="240" height="16" rx="8" fill="rgba(59,130,246,0.4)"/>
  <text x="600" y="478" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.4)">+ Cross-modal (25×)</text>
  <rect x="740" y="445" width="380" height="16" rx="8" fill="rgba(245,158,11,0.4)"/>
  <text x="930" y="478" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.4)">+ Live challenge (100×)</text>

  <!-- Footer -->
  <text x="600" y="560" text-anchor="middle" font-size="14" fill="rgba(255,255,255,0.35)">thecontinuitylab.org · github.com/myshapeprotocol · CPS-0001</text>

  <!-- Open tag -->
  <rect x="510" y="585" width="180" height="28" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="600" y="604" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.4)" letter-spacing="1">OPEN PROTOCOL · OPEN DATA</text>
</svg>
