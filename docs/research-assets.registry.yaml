# Research Asset Registry
# ============================================================
# GOVERNANCE SSOT for MyShape / The Continuity Lab research assets.
#
# This file is authoritative. Any future database is a disposable
# operational read model rebuilt from this file. On conflict this
# file wins and the database is treated as wrong.
#
# No value here may be inferred. Every governance or world-state
# assertion carries evidence. Where evidence is insufficient the
# field is explicitly null with a resolution marker and the
# question stays open.
#
# Structure: Asset -> Version -> Surface
#   asset_id       stable human-facing identity
#   version_id     stable internal identity, immutable
#   version_label  human-readable label, nullable
#   A surface reaches its version only through version_id and
#   never carries asset_id.
#
# The r-index in version_id is record-creation order only. It is
# not a version ordering. Version ordering may only use
# version_label, and null labels are excluded from comparison.
#
# The relationship between a version and its asset comes from the
# data structure, never from parsing the version_id prefix.
# ============================================================

