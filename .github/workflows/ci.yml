name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    # Fails on newly introduced hardcoded credentials. The pre-commit
    # hook (scripts/ip-protection-check.sh CHECK 4) only protects the
    # machine that has it installed; this gate covers everyone.
    #
    # It does not scan git history. A secret committed before this job
    # existed is still in history — only rotation removes it.
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for hardcoded secrets
        run: bash scripts/secret-scan.sh

  quality:
    name: TypeScript + Tests + Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder-service-role-key"
          RESEND_API_KEY: "placeholder-resend-key"
